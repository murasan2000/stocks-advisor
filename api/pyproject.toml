[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.4",
    "langchain-aws>=1.5.0",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.7.1",
    "langgraph>=1.2.4",
    # yfinance(1.5.1)が内部で使う日時比較処理が pandas 3.x だとセグフォルトするため固定。
    "pandas<3",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49.0",
    "xlrd>=2.0.2",
    "yfinance>=1.5.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "mypy>=1.16.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# 実データのCSVサンプル（楽天証券エクスポート形式）をそのまま埋め込むため、
# 行長は意図的に無視する（折り返すとテストの意味が変わる）。
"tests/test_portfolio_csv_import.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
